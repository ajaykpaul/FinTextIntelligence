name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m mypy src/fintext
      - run: python -m pytest tests --cov=fintext --cov-report=term-missing

  # PRD 6.6: nothing is promoted unless it meets the latency objective, so the
  # benchmark is a gate rather than a report.
  slo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - run: python -m fintext.cli bench --gate --output reports/latency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: latency, path: reports/latency.json }

  # PRD 8.4: a canary recall drop over five points triggers a retraining review.
  # It runs on every change, because a lexicon or threshold edit is exactly the
  # kind of change that moves it.
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - run: python -m fintext.cli canary

  # PRD 8.2: replay the provenance set and check the corroboration criteria.
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - run: python -m fintext.cli replay data/samples/provenance_replay.jsonl

  # The UI bundle is committed so the service runs without Node. Rebuilding it
  # here proves the committed assets match the source under web/.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code src/fintext/static

  # PRD 7: the licence log is generated from the catalogue, so it cannot drift
  # from the sources the code declares.
  licence-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - run: |
          python -m fintext.cli catalogue --licence-log docs/LICENCE_LOG.txt
          git diff --exit-code docs/LICENCE_LOG.txt
